<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Учёт расходов BYN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      font-family: system-ui, sans-serif; color: #0f172a;
      background: linear-gradient(135deg, #4f46e5, #7c3aed 45%, #0ea5e9);
    }
    .auth-card {
      width: 100%; max-width: 430px; background: #fff; border-radius: 26px;
      padding: 34px; box-shadow: 0 25px 70px rgba(0,0,0,.28); animation: fade .3s ease;
    }
    .auth-brand { display: flex; align-items: center; gap: 12px; }
    .brand-badge {
      display: grid; place-items: center; width: 42px; height: 42px;
      border-radius: 14px; background: #4f46e5; color: #fff; font-weight: 800;
    }
    h1 { font-size: 22px; margin: 0; }
    .auth-sub { color: #64748b; margin: 10px 0 24px; }
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      background: #f1f5f9; padding: 5px; border-radius: 15px; margin-bottom: 22px;
    }
    .tab {
      border: 0; background: transparent; color: #64748b; padding: 11px;
      border-radius: 11px; font-weight: 700; cursor: pointer; transition: .2s;
    }
    .tab.active { background: #4f46e5; color: #fff; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    input {
      width: 100%; margin-top: 7px; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #cbd5e1; font-size: 15px; outline: none;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79,70,229,.15); }
    .auth-error {
      display: flex; align-items: center; gap: 8px; background: #fee2e2;
      color: #b91c1c; border-radius: 12px; padding: 12px 14px;
      font-size: 14px; margin-bottom: 16px;
    }
    .btn {
      width: 100%; border: 0; border-radius: 14px; background: #4f46e5;
      color: #fff; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn:hover { background: #4338ca; }
    .auth-note { font-size: 12px; color: #64748b; text-align: center; margin-top: 18px; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
<main>
  <section class="auth-card">
    <div class="auth-brand">
      <span class="brand-badge">Br</span>
      <h1>Учёт расходов</h1>
    </div>

    <p class="auth-sub">Личный бюджет в белорусских рублях</p>

    <div class="tabs">
      <button type="button" class="tab {{ 'active' if mode == 'login' }}" data-mode="login">Вход</button>
      <button type="button" class="tab {{ 'active' if mode == 'register' }}" data-mode="register">Регистрация</button>
    </div>

    <form method="post">
      <input type="hidden" name="mode" id="modeInput" value="{{ mode }}">

      <label>
        Ник аккаунта
        <input type="text" name="nickname" value="{{ request.form.get('nickname', '') }}"
               placeholder="Например: alex" minlength="3" required>
      </label>

      <label>
        Пароль
        <input type="password" name="password" placeholder="Минимум 4 символа" minlength="4" required>
      </label>

      {% if error %}
        <div class="auth-error">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ error }}
        </div>
      {% endif %}

      <button class="btn" type="submit">
        {{ 'Создать аккаунт' if mode == 'register' else 'Войти' }}
      </button>
    </form>

    <p class="auth-note">
      Один аккаунт привязывается к этому устройству.<br>
      При следующем открытии сайта вход не потребуется.
    </p>
  </section>
</main>

<script>
  const tabs = document.querySelectorAll(".tab");
  const modeInput = document.getElementById("modeInput");
  const submitButton = document.querySelector("form button[type=submit]");

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(item => item.classList.remove("active"));
      tab.classList.add("active");
      modeInput.value = tab.dataset.mode;
      submitButton.textContent = tab.dataset.mode === "register" ? "Создать аккаунт" : "Войти";
    });
  });
</script>
</body>
</html>
