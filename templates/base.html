<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учёт расходов — BYN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="/" class="brand">
      <span class="brand-badge">Br</span>
      <span>Учёт расходов</span>
    </a>

    <button class="hamburger" id="hamburger" aria-label="Меню">
      <i class="fa-solid fa-bars"></i>
    </button>

    <nav class="nav" id="nav">
      <a href="/" class="{{ 'active' if request.path == '/' }}">Дашборд</a>
      <a href="/transactions" class="{{ 'active' if request.path == '/transactions' }}">Транзакции</a>
      <a href="/analytics" class="{{ 'active' if request.path == '/analytics' }}">Аналитика</a>
    </nav>

    <div class="header-actions">
      <a href="/export/csv" class="btn ghost"><i class="fa-solid fa-download"></i> CSV</a>
      <button class="btn ghost" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
      <button class="btn primary" id="addExpenseBtn"><i class="fa-solid fa-plus"></i> Добавить</button>
      <a href="/logout" class="btn ghost user-chip"><i class="fa-solid fa-user"></i> {{ user.nickname }}</a>
    </div>
  </div>
</header>

<main class="container page">
  {% block content %}{% endblock %}
</main>

<div class="modal hidden" id="expenseModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Новый расход</h2>
      <button class="icon-btn" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <form id="expenseForm">
      <label>Сумма, BYN
        <input type="number" id="amount" step="0.01" min="0.01" required>
      </label>

      <label>Категория
        <select id="category" required>
          {% for category in categories %}
            <option value="{{ category.name }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Дата
        <input type="date" id="date" required>
      </label>

      <label>Комментарий
        <input type="text" id="comment" placeholder="Например: обед">
      </label>

      <p class="error hidden" id="formError"></p>

      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelModal">Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
